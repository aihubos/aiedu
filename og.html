<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>OG 1200×630</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px}
  body{margin:0;overflow:hidden;background:#fff;font-family:"Pretendard",sans-serif;color:#10224F;word-break:keep-all;-webkit-font-smoothing:antialiased}
  .og{display:flex;width:1200px;height:630px}
  .left{flex:1;padding:64px 56px 56px 72px;display:flex;flex-direction:column}
  .left .logo{height:60px;width:auto;align-self:flex-start}
  .pill{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:10px;background:#EAF0FF;color:#1E5EFF;font-weight:700;font-size:24px;padding:10px 20px;border-radius:999px}
  .pill .dot{width:10px;height:10px;border-radius:50%;background:#1E5EFF}
  h1{margin-top:26px;font-size:68px;line-height:1.2;font-weight:800;letter-spacing:-0.035em}
  h1 .b{color:#1E5EFF}
  h1 .n{color:#10224F}
  .right{width:440px;background:#1E5EFF;color:#fff;padding:64px 52px 52px;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .right::after{content:"";position:absolute;right:-110px;top:-110px;width:300px;height:300px;border-radius:50%;border:44px solid rgba(255,255,255,.08)}
  .lime{align-self:flex-start;background:#D8FF6A;color:#10224F;font-size:30px;font-weight:800;padding:10px 22px;border-radius:14px;letter-spacing:-0.02em;position:relative;z-index:1}
  .copy{margin-top:28px;font-size:44px;line-height:1.28;font-weight:800;letter-spacing:-0.03em;position:relative;z-index:1}
  .sub{margin-top:22px;font-size:24px;font-weight:600;opacity:.92;letter-spacing:-0.01em}
  .foot{margin-top:auto;padding-top:22px;border-top:1.5px solid rgba(255,255,255,.35);display:flex;justify-content:space-between;font-size:16px;font-weight:700;letter-spacing:0.08em;white-space:nowrap}
  .foot span:last-child{color:#D8FF6A}
</style>
</head>
<body>
<div class="og">
  <div class="left">
    <img class="logo" src="logo.png" alt="AI빌더스랩">
    <span class="pill"><span class="dot"></span>당근모임 AI빌더스랩</span>
    <h1><span class="b">비전공자도</span><br><span class="n">직접 만드는 AI 교육</span></h1>
  </div>
  <div class="right">
    <span class="lime">실습 중심</span>
    <div class="copy">직접 해보고<br>같이 리뷰해요</div>
    <div class="sub">당근모임 참여 · AI교육 신청</div>
    <div class="foot"><span>AI BUILDERS LAB</span><span>MEMBER BENEFIT</span></div>
  </div>
</div>
</body>
</html>
